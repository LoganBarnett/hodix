name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flake-checks:
    name: Flake checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main
      - name: Run the flake checks
        run: nix flake check --print-build-logs

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main
      - name: Check formatting
        run: nix develop --command treefmt --fail-on-change
